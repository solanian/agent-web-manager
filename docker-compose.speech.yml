name: agent-web-manager-speech

services:
  awm-whisper-asr:
    image: hwdsl2/whisper-server:${AWM_SPEECH_WHISPER_IMAGE_TAG:-latest}
    container_name: awm-whisper-asr
    restart: unless-stopped
    ports:
      - "${AWM_SPEECH_ASR_PORT:-19090}:9000/tcp"
    environment:
      WHISPER_MODEL: ${AWM_SPEECH_WHISPER_MODEL:-base}
      WHISPER_LANGUAGE: ${AWM_SPEECH_WHISPER_LANGUAGE:-ko}
      WHISPER_DEVICE: ${AWM_SPEECH_WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${AWM_SPEECH_WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_THREADS: ${AWM_SPEECH_WHISPER_THREADS:-2}
      WHISPER_PORT: "9000"
    volumes:
      - awm-whisper-data:/var/lib/whisper

  awm-supertonic-tts:
    build:
      context: .
      dockerfile: apps/supertonic-tts/Dockerfile
    image: agent-web-manager/supertonic-tts:local
    container_name: awm-supertonic-tts
    restart: unless-stopped
    ports:
      - "${AWM_SPEECH_TTS_PORT:-18880}:5050/tcp"
    environment:
      SUPERTONIC_MODEL: ${AWM_SPEECH_SUPERTONIC_MODEL:-supertonic-2}
      SUPERTONIC_LANGUAGE: ${AWM_SPEECH_SUPERTONIC_LANGUAGE:-ko}
      SUPERTONIC_VOICE: ${AWM_SPEECH_SUPERTONIC_VOICE:-F1}
      SUPERTONIC_TOTAL_STEPS: ${AWM_SPEECH_SUPERTONIC_TOTAL_STEPS:-5}
      SUPERTONIC_SPEED: ${AWM_SPEECH_SUPERTONIC_SPEED:-1.05}
      SUPERTONIC_RESPONSE_FORMAT: ${AWM_SPEECH_TTS_FORMAT:-wav}
      SUPERTONIC_MODEL_DIR: /models/supertonic
      HF_HOME: /models/huggingface
    volumes:
      - awm-supertonic-models:/models

volumes:
  awm-whisper-data:
  awm-supertonic-models:
