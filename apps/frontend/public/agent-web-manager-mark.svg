<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Web Manager logo</title>
  <desc id="desc">AI monogram over a connected session graph</desc>
  <defs>
    <linearGradient id="awm-bg" x1="24" y1="18" x2="232" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D1F"/>
      <stop offset="0.52" stop-color="#102A52"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="awm-graph" x1="44" y1="188" x2="210" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="awm-ai" x1="58" y1="65" x2="201" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEBFF"/>
    </linearGradient>
    <filter id="awm-soft-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <filter id="awm-glow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="18" y="18" width="220" height="220" rx="54" fill="url(#awm-bg)"/>
  <rect x="18.75" y="18.75" width="218.5" height="218.5" rx="53.25" stroke="#93C5FD" stroke-opacity="0.24" stroke-width="1.5"/>

  <g opacity="0.94" filter="url(#awm-glow)">
    <path d="M49 161L83 104L122 128L158 76L205 113" stroke="url(#awm-graph)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.48"/>
    <path d="M82 104L105 178L158 76L176 174" stroke="url(#awm-graph)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.34"/>
    <path d="M49 161L105 178L176 174L205 113" stroke="url(#awm-graph)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.28"/>
  </g>

  <g filter="url(#awm-glow)">
    <circle cx="49" cy="161" r="12" fill="#22D3EE"/>
    <circle cx="83" cy="104" r="10" fill="#38BDF8"/>
    <circle cx="122" cy="128" r="9" fill="#60A5FA"/>
    <circle cx="158" cy="76" r="11" fill="#818CF8"/>
    <circle cx="205" cy="113" r="12" fill="#A78BFA"/>
    <circle cx="105" cy="178" r="9" fill="#2DD4BF"/>
    <circle cx="176" cy="174" r="10" fill="#C084FC"/>
  </g>

  <g filter="url(#awm-soft-shadow)">
    <path d="M50 185L88 70H116L154 185H128L121 160H82L75 185H50ZM89 138H115L102 94L89 138Z" fill="url(#awm-ai)"/>
    <rect x="164" y="72" width="42" height="21" rx="8" fill="url(#awm-ai)"/>
    <rect x="176" y="91" width="18" height="74" rx="6" fill="url(#awm-ai)"/>
    <rect x="164" y="163" width="42" height="21" rx="8" fill="url(#awm-ai)"/>
  </g>

  <path d="M207 59C218 75 224 94 224 116" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6" stroke-linecap="round"/>
  <path d="M45 199C33 184 28 165 30 145" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="6" stroke-linecap="round"/>
</svg>
